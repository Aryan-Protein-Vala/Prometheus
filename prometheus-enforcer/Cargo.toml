[package]
name = "prometheus-enforcer"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
lazy_static = "1.4"
rust-embed = "8.2"
mime_guess = "2.0"
sysinfo = "0.33"
socket2 = { version = "0.5", features = ["all"] }
